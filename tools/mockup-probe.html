<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>probe</title>
  <style>
    html,
    body {
      margin: 0;
      background: #222;
    }

    iframe {
      border: 0;
      display: block;
    }
  </style>
</head>

<body>
  <!-- v2 探针：量测「桌面优先」稿的几何（画框 / 对话框高度 / 两侧头像 / 面板） -->
  <iframe id="f" src="/design/mockups/desktop-vn.html"></iframe>
  <pre id="out">PENDING</pre>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var W = Number(q.get('w') || 1920), H = Number(q.get('h') || 1080);
      var seg = q.get('seg'), theme = q.get('theme') || 'dark';
      var f = document.getElementById('f');
      f.width = W; f.height = H;
      f.src = '/design/mockups/desktop-vn.html?theme=' + theme + '&noanim=1' + (seg !== null ? '&seg=' + seg : '');

      f.addEventListener('load', function () {
        var r = { viewport: W + 'x' + H, seg: seg === null ? 'default' : seg, theme: theme, notes: [], fail: [] };
        try { measure(f, r, W, H); } catch (e) { r.fail.push('EXCEPTION: ' + e.message); }
        setTimeout(function () {
          try { after(f, r, W, H); } catch (e) { r.fail.push('EXCEPTION(after): ' + e.message); }
          document.getElementById('out').textContent =
            '@@PROBE@@' + encodeURIComponent(JSON.stringify(r)) + '@@END@@';
        }, 700);
      });

      function tag(el) {
        return el.tagName.toLowerCase() + (el.className && typeof el.className === 'string' ? '.' + el.className.split(' ').slice(0, 2).join('.') : '');
      }

      function rect(el) {
        if (!el) return null;
        var b = el.getBoundingClientRect();
        return { l: Math.round(b.left), t: Math.round(b.top), r: Math.round(b.right), b: Math.round(b.bottom), w: Math.round(b.width), h: Math.round(b.height) };
      }

      /* 面板开合 / 侧滑（过渡结束后的复测） */
      function after(f, r, W, H) {
        var d = f.contentDocument, w = f.contentWindow;
        var $ = function (s) { return d.querySelector(s); };

        /* ---------- A. 数据中心 = 右下方悬浮窗（非模态，可边玩边看） ---------- */
        var dockClosed = rect($('.dock'));
        r.dockClosed = {
          box: dockClosed,
          opacity: w.getComputedStyle($('.dock')).opacity,
          pointerEvents: w.getComputedStyle($('.dock')).pointerEvents
        };
        if (parseFloat(r.dockClosed.opacity) > 0.05) r.fail.push('数据中心收起时仍可见 opacity=' + r.dockClosed.opacity);
        if (r.dockClosed.pointerEvents !== 'none') r.fail.push('数据中心收起时仍拦截点击');

        var fabBox = rect($('#fabData'));
        $('#fabData').click();
        var dockOpen = rect($('.dock')), hudR = rect($('.hud')), avatarR = rect($('#avR')), dlgR = rect($('.dialog'));
        r.dockOpen = {
          box: dockOpen,
          inside: dockOpen.l >= 0 && dockOpen.r <= W + 1 && dockOpen.t >= 0 && dockOpen.b <= H + 1,
          overHud: dockOpen.t < hudR.b - 1,
          overFab: dockOpen.b > fabBox.t + 1,
          overAvatar: !!(avatarR && dockOpen.b > avatarR.t + 1 && dockOpen.l < avatarR.r - 1),
          overDialog: !!(dlgR && dockOpen.b > dlgR.t + 1 && dockOpen.l < dlgR.r - 1),
          scrimOpacity: w.getComputedStyle($('#scrim')).opacity
        };
        if (!r.dockOpen.inside) r.fail.push('数据中心悬浮窗越界: ' + JSON.stringify(dockOpen));
        if (r.dockOpen.overHud) r.fail.push('悬浮窗盖住顶部 HUD');
        if (r.dockOpen.overFab) r.fail.push('悬浮窗压住悬浮按钮（按钮应始终可见）');
        if (r.dockOpen.overAvatar) r.fail.push('悬浮窗压住右侧头像');
        if (r.dockOpen.overDialog) r.fail.push('悬浮窗压住对话框');
        if (parseFloat(r.dockOpen.scrimOpacity) > 0.05) r.fail.push('悬浮窗带遮罩（模态），无法继续游戏');
        /* 打开悬浮窗时仍能推进剧情 */
        var bb = $('#segBadge').textContent.split('/');
        if (parseInt(bb[0], 10) < parseInt(bb[1], 10)) {
          $('#btnNext').click();
          r.dockOpen.canPlayOn = $('#dock').classList.contains('on') && $('#segBadge').textContent !== bb.join('/');
          $('#btnPrev').click();
        } else {
          r.dockOpen.canPlayOn = 'skipped(已在最后一段)';
        }
        if (r.dockOpen.canPlayOn !== true && r.dockOpen.canPlayOn !== 'skipped(已在最后一段)') {
          r.fail.push('悬浮窗打开时无法继续推进剧情');
        }
        $('#btnDockClose').click();
        if (parseFloat(w.getComputedStyle($('.dock')).opacity) > 0.05) r.fail.push('数据中心未收起');

        /* ---------- B. 左侧游戏列表：纵向竖条 + 向左折叠的展开面板 ---------- */
        var frameBefore = rect($('.art-frame'));
        var strip = rect($('.sidebar-strip'));
        var minis = Array.prototype.slice.call(d.querySelectorAll('#stripAvatars .strip-av')).map(rect);
        r.sidebar = {
          strip: strip, minis: minis,
          stackedVertically: minis.length > 1 && minis.every(function (b, i) { return i === 0 || b.t >= minis[i - 1].b - 1; }),
          narrowStrip: strip.w <= 80,
          panelClosedLeft: rect($('.sidebar-panel')).l,
          panelClosedOpacity: w.getComputedStyle($('.sidebar-panel')).opacity
        };
        if (!r.sidebar.stackedVertically) r.fail.push('左侧游戏栏不是纵向列表');
        if (r.sidebar.panelClosedLeft > -1) r.fail.push('侧栏收起时面板未移出左侧: l=' + r.sidebar.panelClosedLeft);

        $('#btnExpandSidebar').click();
        var panelOpen = rect($('.sidebar-panel'));
        var frameAfter = rect($('.art-frame'));
        r.sidebar.panelOpen = panelOpen;
        r.sidebar.panelInside = panelOpen.l >= -1 && panelOpen.r <= W + 1 && panelOpen.t >= -1 && panelOpen.b <= H + 1;
        r.sidebar.openNoReflow = Math.abs(frameAfter.w - frameBefore.w) <= 1 && Math.abs(frameAfter.h - frameBefore.h) <= 1;
        r.sidebar.hasNewGame = !!$('#leftSidebar .save-item.new');
        r.sidebar.newGameText = ($('#leftSidebar .save-item.new') || { textContent: '' }).textContent.trim();
        r.sidebar.progressRows = d.querySelectorAll('#leftSidebar .save-item').length - 1;
        if (!r.sidebar.panelInside) r.fail.push('侧栏展开后越界: ' + JSON.stringify(panelOpen));
        if (!r.sidebar.openNoReflow) r.fail.push('展开侧栏挤压了 CG（画面跳动）: ' + JSON.stringify(frameBefore) + ' -> ' + JSON.stringify(frameAfter));
        if (!r.sidebar.hasNewGame) r.fail.push('侧栏缺少“新开游戏”入口');
        if (r.sidebar.progressRows < 1) r.fail.push('侧栏缺少进度列表');
        $('#btnCollapseSidebar').click();
        r.sidebar.panelAfterCollapse = rect($('.sidebar-panel')).l;
        if (r.sidebar.panelAfterCollapse > -1) r.fail.push('侧栏未能向左折叠: l=' + r.sidebar.panelAfterCollapse);

        /* 侧滑面板：完全进入视口 */
        $('#btnHist').click();
        var sh = rect($('#sheetHist'));
        r.sheetHist = sh;
        if (!sh || sh.r > W + 2) r.fail.push('历史记录面板未完全进入视口 right=' + (sh && sh.r));
        d.querySelector('#scrim').click();

        $('#btnMenu').click();
        var mp = rect($('.menu-panel'));
        r.menu = { display: w.getComputedStyle($('.menu')).display, panel: mp };
        if (!mp || mp.w < 600) r.fail.push('菜单面板过窄: ' + (mp && mp.w));
        if (mp && (mp.b > H + 1 || mp.t < -1)) r.fail.push('菜单面板越界');
        $('#menuClose').click();
      }

      function measure(f, r, W, H) {
        var d = f.contentDocument, w = f.contentWindow;
        var $ = function (s) { return d.querySelector(s); };
        var cs = function (el, p, pe) { return el ? w.getComputedStyle(el, pe || null).getPropertyValue(p).trim() : ''; };

        /* 无头环境 virtual time 不推进 CSS 过渡，先关掉过渡/动画再复测 */
        var kill = d.createElement('style');
        kill.textContent = '*,*::before,*::after{transition:none!important;animation:none!important}';
        d.head.appendChild(kill);
        w.dispatchEvent(new Event('resize'));

        var stage = rect($('.stage')), frame = rect($('.art-frame')), cg = $('#cgImg');
        var chipLoc = rect($('.chip-loc')), chipCg = rect($('.chip-cg'));
        var dl = rect($('.dialog')), cm = rect($('.cmd')), ch = rect($('.choices'));
        var avL = rect($('#avL')), avR = rect($('#avR')), hd = rect($('.hud')), dk = rect($('.dock'));

        r.boxes = {
          hud: hd, stage: stage, artFrame: frame, chipLoc: chipLoc, chipCg: chipCg,
          choices: ch, dialog: dl, cmd: cm, avL: avL, avR: avR, dock: dk
        };

        /* ---------- 1. CG 画框：贴合单图、等比、框外是背景色 ---------- */
        var nw = cg.naturalWidth || 0, nh = cg.naturalHeight || 0;
        var frameAspect = frame ? frame.w / frame.h : 0, imgAspect = nh ? nw / nh : 0;
        var afterBorder = frame ? cs($('.art-frame'), 'border-top-width', '::after') : '';
        var afterColor = frame ? cs($('.art-frame'), 'border-top-color', '::after') : '';
        r.artFrame = {
          imgNatural: nw + 'x' + nh, frameAspect: +frameAspect.toFixed(3), imgAspect: +imgAspect.toFixed(3),
          aspectErrPct: imgAspect ? +(Math.abs(frameAspect - imgAspect) / imgAspect * 100).toFixed(2) : -1,
          insideStage: !!(frame && stage && frame.l >= stage.l - 1 && frame.r <= stage.r + 1 && frame.t >= stage.t - 1 && frame.b <= stage.b + 1),
          fillsStageH: !!(frame && stage && frame.h >= stage.h - 2),
          margin: frame && stage ? { left: frame.l - stage.l, right: stage.r - frame.r, top: frame.t - stage.t, bottom: stage.b - frame.b } : null,
          borderWidth: afterBorder, borderColor: afterColor,
          corners: d.querySelectorAll('.art-frame .corner').length,
          cgObjectFit: cs(cg, 'object-fit')
        };
        if (!frame) r.fail.push('未找到 .art-frame');
        else {
          if (r.artFrame.aspectErrPct > 2) r.fail.push('CG 画框与图片比例不符: 误差 ' + r.artFrame.aspectErrPct + '%');
          if (!r.artFrame.insideStage) r.fail.push('CG 画框超出舞台: ' + JSON.stringify(r.artFrame.margin));
          if (parseFloat(afterBorder) < 1) r.fail.push('CG 画框缺少描边');
          if (r.artFrame.corners !== 4) r.fail.push('CG 画框角标数量异常: ' + r.artFrame.corners);
          /* 宽屏下图片应吃满可用高度（不因 UI 膨胀而被压小） */
          if (!r.artFrame.fillsStageH) r.fail.push('CG 未吃满舞台高度: frame.h=' + frame.h + ' < stage.h=' + stage.h);
          if (frame.w / W < 0.55) r.notes.push('CG 宽度偏小: ' + frame.w + 'px (' + Math.round(frame.w / W * 100) + '% 视口宽)');
        }
        /* 角落标签必须落在画框内 */
        [['chipLoc', chipLoc], ['chipCg', chipCg]].forEach(function (p) {
          var b = p[1];
          if (!b || !frame) return;
          if (b.l < frame.l - 1 || b.r > frame.r + 1 || b.t < frame.t - 1 || b.b > frame.b + 1) {
            r.fail.push('信息标签越出画框: ' + p[0] + ' ' + JSON.stringify(b));
          }
        });

        /* ---------- 2. 对话框高度（要求显著小于 1/4 屏高） ---------- */
        r.dialog = {
          h: dl.h, pctOfViewport: +(dl.h / H * 100).toFixed(1),
          boxHVar: cs(d.documentElement, '--box-h'),
          plateVisible: cs($('.plate-row'), 'visibility'),
          fontPx: cs($('.dlg-text'), 'font-size')
        };
        if (dl.h / H > 0.24) r.fail.push('对话框过高: ' + dl.h + 'px = ' + r.dialog.pctOfViewport + '% 屏高');
        if (dl.b > H + 1) r.fail.push('对话框底部越界 b=' + dl.b);
        if (dl.h < 110) r.fail.push('对话框过矮，正文放不下: ' + dl.h);

        /* ---------- 3. 两侧头像（贴底、够大、不压中列） ---------- */
        var avW = avL ? avL.w : 0;
        r.avatars = {
          avL: avL, avR: avR, pctOfWidth: +(avW / W * 100).toFixed(1),
          squareL: avL ? Math.abs(avL.w - avL.h) <= 2 : false,
          squareR: avR ? Math.abs(avR.w - avR.h) <= 2 : false,
          sameSize: !!(avL && avR && Math.abs(avL.w - avR.w) <= 2),
          bottomAligned: !!(avL && avR && Math.abs(avL.b - avR.b) <= 2 && Math.abs(avL.b - cm.b) <= 2),
          leftOfDialog: !!(avL && dl && avL.r <= dl.l + 1),
          rightOfDialog: !!(avR && dl && avR.l >= dl.r - 1),
          belowHud: !!(avL && hd && avL.t >= hd.b - 1)
        };
        if (!r.avatars.squareL || !r.avatars.squareR) r.fail.push('头像不是正方形');
        if (!r.avatars.sameSize) r.fail.push('两侧头像尺寸不一致');
        if (!r.avatars.bottomAligned) r.fail.push('头像与指令条未对齐底部: ' +
          JSON.stringify({ avLb: avL && avL.b, avRb: avR && avR.b, cmb: cm.b }));
        if (!r.avatars.leftOfDialog || !r.avatars.rightOfDialog) r.fail.push('头像未位于对话框两侧');
        if (!r.avatars.belowHud) r.fail.push('头像与 HUD 重叠');
        if (avW / W < 0.07) r.fail.push('头像偏小（要求“较大头像”）: ' + avW + 'px = ' + r.avatars.pctOfWidth + '% 视口宽');
        if (avL && avL.b > H + 1) r.fail.push('头像底部越界 b=' + avL.b);

        /* ---------- 4. 重叠检查 ---------- */
        function ov(a, b) {
          if (!a || !b) return false;
          return a.l < b.r - 1 && b.l < a.r - 1 && a.t < b.b - 1 && b.t < a.b - 1;
        }
        var ovl = {
          choicesDialog: ov(ch, dl), choicesCmd: ov(ch, cm), choicesAvatarL: ov(ch, avL), choicesAvatarR: ov(ch, avR),
          choicesHud: ov(ch, hd), cmdDialog: ov(cm, dl), cmdHud: ov(cm, hd),
          hudStage: hd && stage ? ov(hd, stage) : false,
          dialogAvatarL: ov(dl, avL), dialogAvatarR: ov(dl, avR)
        };
        r.overlaps = ovl;
        Object.keys(ovl).forEach(function (k) { if (ovl[k]) r.fail.push('元素重叠: ' + k); });

        /* ---------- 5. 溢出（跳过有意移出画布的面板 / 大图层） ---------- */
        var SKIP = '.viewer *, .sheet, .sheet *, .menu *, .dock, .dock *, .scrim, .sidebar-panel, .sidebar-panel *';
        r.docScroll = { sw: d.documentElement.scrollWidth, sh: d.documentElement.scrollHeight, iw: w.innerWidth, ih: w.innerHeight };
        if (r.docScroll.sw > w.innerWidth + 1) r.fail.push('水平溢出: scrollWidth=' + r.docScroll.sw + ' > ' + w.innerWidth);
        if (r.docScroll.sh > w.innerHeight + 1) r.fail.push('垂直溢出: scrollHeight=' + r.docScroll.sh + ' > ' + w.innerHeight);
        d.querySelectorAll('.app *').forEach(function (el) {
          if (el.matches(SKIP)) return;
          var b = el.getBoundingClientRect();
          if (b.width === 0 || b.height === 0) return;
          if (b.right > w.innerWidth + 2) r.fail.push('越界(右): ' + tag(el) + ' right=' + Math.round(b.right));
          if (b.left < -2) r.fail.push('越界(左): ' + tag(el) + ' left=' + Math.round(b.left));
        });

        /* ---------- 6. 正文裁切 & 滚动提示 ---------- */
        var isNarr = $('#dialog').classList.contains('is-narr');
        var body = isNarr ? $('.dlg-narr') : $('.dlg-text');
        var bodyBox = rect(body);
        r.text = {
          mode: isNarr ? 'narr' : 'dialog',
          box: bodyBox, scrollH: body.scrollHeight, clientH: body.clientHeight,
          overflowing: body.scrollHeight > body.clientHeight + 2,
          hintOn: $('#narHint').classList.contains('on'),
          toolsTop: rect($('.tools')).t,
          textInsideDialog: !!bodyBox && bodyBox.b <= rect($('.tools')).t + 1
        };
        if (!r.text.textInsideDialog) r.fail.push('正文溢出到工具行之下: text.bottom=' + (bodyBox && bodyBox.b) + ' > tools.top=' + r.text.toolsTop);
        if (r.text.overflowing !== r.text.hintOn) r.fail.push('滚动提示与正文溢出状态不一致: overflowing=' + r.text.overflowing + ' hint=' + r.text.hintOn);

        /* ---------- 7. 数据中心页签不横滑 ---------- */
        var tabs = $('.dock-tabs'), lastTab = d.querySelectorAll('.dtab')[4];
        r.tabs = {
          containerW: Math.round(tabs.getBoundingClientRect().width), scrollW: tabs.scrollWidth,
          lastTabRight: Math.round(lastTab.getBoundingClientRect().right),
          containerRight: Math.round(tabs.getBoundingClientRect().right)
        };
        if (tabs.scrollWidth > tabs.clientWidth + 1) r.fail.push('数据中心页签横向溢出: scrollW=' + tabs.scrollWidth + ' > clientW=' + tabs.clientWidth);
        if (r.tabs.lastTabRight > r.tabs.containerRight + 1) r.fail.push('最后一个页签被裁掉');

        /* ---------- 8. 主题：仅两套，切换后关键色变化 ---------- */
        var before = { bg: cs(d.body, 'background-color'), text: cs(d.body, 'color'), plate: cs($('.plate b'), 'color') };
        $('#btnTheme').click();
        var to = d.documentElement.getAttribute('data-theme');
        var afterC = { bg: cs(d.body, 'background-color'), text: cs(d.body, 'color'), plate: cs($('.plate b'), 'color'), frameBorder: cs($('.art-frame'), 'border-top-color', '::after') };
        r.themeSwitch = { from: theme, to: to, before: before, after: afterC };
        if (to === theme) r.fail.push('主题未切换');
        if (before.bg === afterC.bg) r.fail.push('切换后 body 背景色未变化');
        if (before.text === afterC.text) r.fail.push('切换后文字颜色未变化');
        $('#btnTheme').click();

        /* ---------- 9. 隐藏界面（H）后只剩 CG ---------- */
        $('#btnHideUI').click();
        var hidden = {
          hudOpacity: cs($('.hud'), 'opacity'), bottomOpacity: cs($('.bottom'), 'opacity'),
          frame: rect($('.art-frame'))
        };
        r.hideUI = hidden;
        if (parseFloat(hidden.hudOpacity) > 0.05) r.fail.push('隐藏界面后 HUD 仍可见');
        if (parseFloat(hidden.bottomOpacity) > 0.05) r.fail.push('隐藏界面后底部演出带仍可见');
        if (hidden.frame.h <= (frame ? frame.h : 0) + 2) r.notes.push('隐藏界面后 CG 未放大（可接受，若希望放大可加规则）');
        $('#btnHideUI').click();

        /* ---------- 10. 行动选项：仅在本轮最后一段出现、居中纵排、回滚即隐藏 ---------- */
        var badge = function () {
          return $('#segBadge').textContent.split('/').map(function (s) { return parseInt(s.trim(), 10); });
        };
        var b0 = badge(), total = b0[1];
        var visibleAtStart = !$('#choices').classList.contains('hidden');
        if (visibleAtStart && b0[0] !== total) {
          r.fail.push('行动选项在非最后一段就出现了: 第 ' + b0[0] + '/' + total + ' 段');
        }
        /* 推进到最后一段 */
        while (badge()[0] < total) $('#btnNext').click();
        var chBox = rect($('.choices'));
        var items = Array.prototype.slice.call(d.querySelectorAll('#choices .ch')).map(rect);
        var cs2 = function (el, p) { return w.getComputedStyle(el).getPropertyValue(p).trim(); };
        r.choices = {
          hiddenAtFirstSegment: !visibleAtStart,
          visibleAtLast: !$('#choices').classList.contains('hidden'),
          box: chBox, items: items,
          count: items.length,
          verticalStack: items.length > 1 && items.every(function (b, i) { return i === 0 || b.t >= items[i - 1].b - 1; }),
          sameWidth: items.length > 1 && items.every(function (b) { return Math.abs(b.w - items[0].w) <= 2; }),
          centredOnStage: !!(chBox && stage) &&
            Math.abs((chBox.l + chBox.r) / 2 - (stage.l + stage.r) / 2) <= 3 &&
            Math.abs((chBox.t + chBox.b) / 2 - (stage.t + stage.b) / 2) <= 3,
          insideStage: !!(chBox && stage && chBox.l >= stage.l - 1 && chBox.r <= stage.r + 1 && chBox.t >= stage.t - 1 && chBox.b <= stage.b + 1),
          overCG: !!(chBox && frame && chBox.l >= frame.l - 1 && chBox.r <= frame.r + 1),
          flexDirection: chBox ? cs2($('.choices'), 'flex-direction') : '',
          cgDimmed: chBox ? cs2($('.art-frame'), 'filter') : ''
        };
        if (!r.choices.visibleAtLast) r.fail.push('推进到最后一段后行动选项未出现');
        if (r.choices.count < 2) r.fail.push('行动选项数量异常: ' + r.choices.count);
        if (!r.choices.verticalStack) r.fail.push('行动选项未纵向排列');
        if (!r.choices.sameWidth) r.fail.push('行动选项宽度不一致');
        if (!r.choices.centredOnStage) r.fail.push('行动选项未居中于 CG 区域: choices=' + JSON.stringify(chBox) + ' stage=' + JSON.stringify(stage));
        if (!r.choices.insideStage) r.fail.push('行动选项越出舞台');
        if (!r.choices.overCG) r.fail.push('行动选项未落在 CG 画面范围内');
        /* 回滚一段 → 必须立刻隐藏；再前进 → 重新出现 */
        $('#btnPrev').click();
        r.choices.hiddenAfterRollback = $('#choices').classList.contains('hidden');
        if (!r.choices.hiddenAfterRollback) r.fail.push('回滚一段后行动选项未隐藏');
        $('#btnNext').click();
        r.choices.reappearAfterForward = !$('#choices').classList.contains('hidden');
        if (!r.choices.reappearAfterForward) r.fail.push('再次推进到最后一段后行动选项未重新出现');
        /* 选项出现时画面应压暗一档 */
        if (!/brightness\(0?\.\d+\)/.test(r.choices.cgDimmed)) r.notes.push('选项出现时画面未压暗: filter=' + r.choices.cgDimmed);
        $('#btnPrev').click();

        /* ---------- 11. 新控件位置：语音开关 / 隐藏UI / BGM / 数据悬浮按钮 ---------- */
        var tts = rect($('#btnTtsToggle')), hide = rect($('#btnHideUI')), hideEl = $('#btnHideUI');
        var bgmBtn = rect($('#btnToggleAudio')), bgmVol = rect($('#bgmVolume')), viz = rect($('#audioVisualizer'));
        var fab = rect($('#fabData'));
        r.controls = {
          tts: tts, hideUI: hide, bgmBtn: bgmBtn, bgmVol: bgmVol, viz: viz, fab: fab,
          ttsInDialogTopRight: !!(tts && dl && tts.r <= dl.r + 1 && tts.t >= dl.t - 1 && tts.t <= dl.t + 44 && tts.l > (dl.l + dl.r) / 2),
          hideRightOfTts: !!(tts && hide && hide.l >= tts.r + 2),
          hideInDialogTop: !!(hide && dl && hide.r <= dl.r + 1 && hide.t <= dl.t + 44),
          hideUIText: hideEl ? hideEl.textContent.trim() : '',
          bgmInHudRight: !!(bgmBtn && bgmVol && hd && bgmBtn.t >= hd.t - 1 && bgmBtn.b <= hd.b + 1 && bgmBtn.l > W / 2 && bgmVol.l > W / 2 && viz.l > W / 2),
          fabAboveAvatar: !!(fab && avR && fab.b <= avR.t + 1 && fab.l < avR.r && fab.r > avR.l)
        };
        if (!r.controls.ttsInDialogTopRight) r.fail.push('语音开关不在对话框右上角: ' + JSON.stringify(tts) + ' dialog=' + JSON.stringify(dl));
        if (!r.controls.hideRightOfTts) r.fail.push('隐藏UI 不在语音开关右侧: tts.r=' + (tts && tts.r) + ' hide.l=' + (hide && hide.l));
        if (!r.controls.hideInDialogTop) r.fail.push('隐藏UI 不在对话框右上角');
        if (r.controls.hideUIText.indexOf('隐藏UI') < 0) r.fail.push('隐藏UI 按钮未标注“隐藏UI”: ' + r.controls.hideUIText);
        if (!r.controls.bgmInHudRight) r.fail.push('BGM 开关 / 音量条不在右上: ' + JSON.stringify({ btn: bgmBtn, vol: bgmVol, viz: viz, hud: hd }));
        if (!r.controls.fabAboveAvatar) r.fail.push('数据中心悬浮按钮不在右侧头像上方: fab=' + JSON.stringify(fab) + ' avR=' + JSON.stringify(avR));
        /* 系统设置关闭 TTS → 开关置灰 + 悬停提示 */
        $('#menuTtsSys').click();
        var ttsOff = {
          disabled: $('#btnTtsToggle').classList.contains('disabled'),
          tip: $('#btnTtsToggle').getAttribute('data-tip') || '',
          opacity: cs($('#btnTtsToggle'), 'opacity')
        };
        r.controls.ttsOff = ttsOff;
        if (!ttsOff.disabled) r.fail.push('系统设置关闭 TTS 后对话框语音开关未置灰');
        if (ttsOff.tip.indexOf('设置') < 0 || ttsOff.tip.indexOf('TTS') < 0) r.fail.push('TTS 关闭时提示文案不对: ' + ttsOff.tip);
        if (parseFloat(ttsOff.opacity) > 0.6) r.notes.push('TTS 置灰不够明显 opacity=' + ttsOff.opacity);
        $('#menuTtsSys').click();
        r.controls.ttsBackOn = !$('#btnTtsToggle').classList.contains('disabled');
        if (!r.controls.ttsBackOn) r.fail.push('重新打开 TTS 后语音开关未恢复');

        r.colors = { frameBorder: cs($('.art-frame'), 'border-top-color', '::after'), docBg: cs(d.body, 'background-color') };
      }
    })();
  </script>
</body>

</html>
